name: CI - Build Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Multi-Arch Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r webui/requirements-dev.txt pip-audit

      - name: Run Python tests
        run: pytest -q

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run ShellCheck
        run: shellcheck entrypoint.sh healthcheck.sh webui/entrypoint.sh webui/healthcheck.sh

      - name: Audit Python dependencies
        run: pip-audit -r webui/requirements.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build VPN Tailscale Bridge Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: protonvpn-tailscale-bridge:latest

      - name: Build bridge image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: protonvpn-tailscale-bridge:ci

      - name: Scan bridge image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: protonvpn-tailscale-bridge:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Build WebUI Image
        uses: docker/build-push-action@v5
        with:
          context: ./webui
          platforms: linux/amd64,linux/arm64
          push: false
          tags: protonvpn-tailscale-webui:latest

      - name: Build WebUI image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: ./webui
          load: true
          tags: protonvpn-tailscale-webui:ci

      - name: Scan WebUI image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: protonvpn-tailscale-webui:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
